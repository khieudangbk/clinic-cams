spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: cams
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway migrations (db/migration); Hibernate only validates it matches.
      ddl-auto: validate
    properties:
      '[hibernate.format_sql]': true
      '[hibernate.jdbc.time_zone]': UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  # SC7 email. Credentials come only from .env; with MAIL_ENABLED=false (default) nothing is sent.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      '[mail.smtp.auth]': ${MAIL_SMTP_AUTH:false}
      '[mail.smtp.starttls.enable]': ${MAIL_STARTTLS:false}
  # spring.jackson.* removed: Boot 4 binds it against the new Jackson 3 (tools.jackson) types,
  # which rejects this classic-Jackson-2 property shape. The equivalent (non_null inclusion, no
  # timestamp dates) is now set directly on the classic ObjectMapper bean in JacksonConfig.

server:
  port: ${SERVER_PORT:8080}

cams:
  # Frozen demo clock, ISO timestamp with +07:00 offset, e.g. 2026-11-23T08:00:00+07:00.
  # Leave unset to run on the real clock.
  demo-now: ${CAMS_DEMO_NOW:}
  mail:
    # false (default): log "email disabled" and send nothing. true: send through SMTP.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@cams.local}
    # Reminder job; set scheduler-enabled=false to stop the automatic run (tests, one-shot demos).
    scheduler-enabled: true
    reminder-interval-ms: 900000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
    '[org.springframework.security]': INFO
