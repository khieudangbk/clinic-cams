spring:
  datasource:
    url: jdbc:h2:mem:auth-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      '[hibernate.format_sql]': false
  # Tests use Hibernate-generated schema on H2, not the PostgreSQL-specific Flyway migrations.
  flyway:
    enabled: false
  # spring.jackson.* removed: see the comment in src/main/resources/application.yml.

cams:
  mail:
    # Tests call the reminder service/endpoint directly; no background job.
    scheduler-enabled: false

cors:
  allowed-origins: http://localhost:5173
